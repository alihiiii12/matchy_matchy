name: matchy_matchy
description: "روزي تاج — rosetaje family fashion store"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  dio: ^5.8.0+1
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  get: ^4.7.2
  file_picker: ^8.1.7
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/fonts/
